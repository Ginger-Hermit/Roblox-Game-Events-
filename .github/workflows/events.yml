name: Game events
on:
  schedule:
    - cron: "7 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daily check for everyone who tapped Turn on
        env:
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: |
          C=""
          for i in $(seq 1 60); do
            R=$(curl -fsS -m 60 -X POST -H "X-Run-Key: $RUN_KEY" "https://roblox-game-events.pages.dev/api/run?cursor=$C") || { echo "helper not reachable"; break; }
            echo "$R"
            [ "$(echo "$R" | jq -r .done)" = "true" ] && break
            C=$(echo "$R" | jq -r .cursor)
          done
      - run: python3 events/check.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - run: |
          git diff --quiet events/seen.json site/events.json && exit 0
          git config user.name "events-bot"; git config user.email "events-bot@users.noreply.github.com"
          git add events/seen.json site/events.json; git commit -m "Events: remember posted"; git pull --rebase -q; git push
