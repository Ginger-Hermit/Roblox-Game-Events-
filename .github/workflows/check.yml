name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/test_site.py
      - run: python3 tests/test_security.py
      - run: sh tools/find_errors.sh
      - name: Check the GitHub jobs
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Raise a flag
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Check failed" --body "Red cross on main. Run ${{ github.run_id }}" || true
