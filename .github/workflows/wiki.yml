# Patch note: copies the docs into the GitHub wiki after each push, so nobody pastes by hand.
name: Wiki
on:
  push:
    branches: [main]
    paths: [README.md, STATUS.md, CHANGELOG.md, CLAUDE.md, LIVE_CHECK_LOG.md, tools/wiki_sync.py, .github/workflows/wiki.yml]
permissions:
  contents: write
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy docs to wiki
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki || { echo "Make the first wiki page on GitHub once, then this works."; exit 0; }
          python3 -I tools/wiki_sync.py wiki
          cd wiki
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions" -c user.email="noreply@github.com" commit -m "Sync docs from repo"
          git push
